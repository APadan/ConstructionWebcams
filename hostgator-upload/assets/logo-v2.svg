<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" fill="none">
  <!-- Concept 2: Bold 'CW' Monogram with Nested 6-Blade Shutter Aperture -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#0D1117" stroke="#21262D" stroke-width="1.5"/>
    <!-- Geometric Hexagonal 'C' Frame -->
    <path d="M37 20 H21 L12 40 L21 60 H37" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="square" stroke-linejoin="miter"/>
    <!-- Nested Precision Aperture Ring & Blades inside C -->
    <circle cx="28" cy="40" r="10.5" stroke="#FF5500" stroke-width="3"/>
    <circle cx="28" cy="40" r="3.5" fill="#FFFFFF"/>
    <!-- Bold Geometric 'W' -->
    <path d="M41 20 L48 58 L55.5 34 L63 58 L70 20" stroke="#FFFFFF" stroke-width="6.5" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <text x="104" y="46" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="30" letter-spacing="-0.8">CONSTRUCTION</text>
  <text x="104" y="76" fill="#FF5500" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22" letter-spacing="3.5">WEBCAMS</text>
  <rect x="278" y="56" width="68" height="24" rx="6" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
  <circle cx="291" cy="68" r="3.5" fill="#FF5500"/>
  <text x="300" y="72.5" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.8">4K LIVE</text>
</svg>
