<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" fill="none">
  <!-- Concept 4: Precision Shutter Aperture inside Segmented Viewfinder Frame -->
  <g transform="translate(4, 8)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="#090C10" stroke="#21262D" stroke-width="1.5"/>
    <!-- Segmented Viewfinder Frame -->
    <path d="M14 26 V14 H26 M54 14 H66 V26 M66 54 V66 H54 M26 66 H14 V54" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square"/>
    <path d="M33 14 H47 M66 33 V47 M47 66 H33 M14 47 V33" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="square"/>
    <!-- Outer & Inner Aperture Rings + Shutter Blades -->
    <circle cx="40" cy="40" r="18" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="40" cy="40" r="9.5" stroke="#FFFFFF" stroke-width="2.5"/>
    <line x1="40" y1="22" x2="48" y2="33" stroke="#FFFFFF" stroke-width="2.2"/>
    <line x1="58" y1="40" x2="47" y2="48" stroke="#FFFFFF" stroke-width="2.2"/>
    <line x1="40" y1="58" x2="32" y2="47" stroke="#FFFFFF" stroke-width="2.2"/>
    <line x1="22" y1="40" x2="33" y2="32" stroke="#FFFFFF" stroke-width="2.2"/>
    <!-- International Orange Live Tally Dot -->
    <circle cx="58" cy="22" r="4" fill="#FF5500"/>
  </g>

  <text x="104" y="46" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="30" letter-spacing="-0.8">CONSTRUCTION</text>
  <text x="104" y="76" fill="#E2E8F0" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="22" letter-spacing="3.5">WEBCAMS</text>
  <rect x="278" y="56" width="68" height="24" rx="6" fill="rgba(255, 85, 0, 0.16)" stroke="#FF5500" stroke-width="1.5"/>
  <circle cx="291" cy="68" r="3.5" fill="#FF5500"/>
  <text x="300" y="72.5" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.8">4K LIVE</text>
</svg>
