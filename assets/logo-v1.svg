<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 96" fill="none">
  <!-- Concept 1: Minimalist Viewfinder & Precision Optic (Verkada / Leica / RED Style) -->
  <g transform="translate(4, 8)">
    <!-- Matte Obsidian Hardware Tile -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="#111622" stroke="#263044" stroke-width="1.5"/>

    <!-- 4 Precision Viewfinder Corner Brackets -->
    <path d="M16 28 V18 C16 16.8954 16.8954 16 18 16 H28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M52 16 H62 C63.1046 16 64 16.8954 64 18 V28" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M64 52 V62 C64 63.1046 63.1046 64 62 64 H52" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M28 64 H18 C16.8954 64 16 63.1046 16 62 V52" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Minimalist Optical Lens Ring -->
    <circle cx="40" cy="40" r="14" stroke="#FFFFFF" stroke-width="4"/>
    <circle cx="40" cy="40" r="5" fill="#FF5500"/>

    <!-- International Orange Live Tally Dot -->
    <circle cx="56" cy="24" r="4" fill="#FF5500"/>
  </g>

  <!-- Ultra-Clean Modern Typography -->
  <text x="104" y="46" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="30" letter-spacing="-0.8">CONSTRUCTION</text>
  <text x="104" y="76" fill="#94A3B8" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="22" letter-spacing="3.5">WEBCAMS</text>

  <!-- Minimalist 4K LIVE Pill -->
  <rect x="278" y="56" width="68" height="24" rx="6" fill="#FF5500"/>
  <circle cx="291" cy="68" r="3.5" fill="#FFFFFF"/>
  <text x="300" y="72.5" fill="#FFFFFF" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="11.5" letter-spacing="0.8">4K LIVE</text>
</svg>
